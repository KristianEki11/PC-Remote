name: Rust server and Flutter checks
on:
  pull_request:
    paths: ['server-rust/**', 'app/**', 'installer/rust/**', 'scripts/rust/**', '.github/workflows/rust.yml']
  push:
    branches: [main, plan/rust-tailscale]
    paths: ['server-rust/**', 'app/**', 'installer/rust/**', 'scripts/rust/**', '.github/workflows/rust.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Compile installer
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location ../installer/rust
          & 'C:/Program Files (x86)/NSIS/makensis.exe' PCRemoteRust.nsi
          $result = $LASTEXITCODE
          Pop-Location
          exit $result
      - uses: actions/upload-artifact@v4
        with:
          name: pc-remote-rust-windows
          path: |
            server-rust/target/release/pcremote-server.exe
            installer/rust/PCRemoteRustSetup.exe
          if-no-files-found: error
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: pc-remote-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
