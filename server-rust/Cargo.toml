[package]
name = "pcremote-server"
version = "5.0.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
rcgen = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
if-addrs = "0.13"
url = "2"
futures-util = "0.3"
bcrypt = "0.17"
subtle = "2"
windows = { version = "0.62", features = ["Foundation", "Media_Control", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_System_Power", "Win32_System_Threading", "Win32_System_Shutdown", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Security", "Win32_System_RemoteDesktop"] }
wmi = "0.17"
windows-core = "0.62"

[dependencies.windows-sys]
version = "0.61"
features = ["Win32_Storage_FileSystem"]

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true


